# btbz-SharpTalk — edge reverse proxy, production. Amoeba Structure v2 §5.1.
# Routes /api/ → api:3000, everything else → web:80.
upstream sharptalk_api {
    server api:3000;
}
upstream sharptalk_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Compression (PERF-4): ~68% transfer cut on JS/CSS/JSON.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;


    # API → NestJS (it serves under API_PREFIX=api/v1, so keep the /api prefix).
    # Static live widget design (PLN-260910 P4 D-14): written by the API into the
    # uploads volume, served here straight from disk so a widget's first paint
    # does not depend on the API being up. no-cache: the file changes when the
    # tenant applies a design, and a stale theme is exactly what this avoids.
    location /widget-design/live/ {
        alias /data/uploads/widget-live/;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://sharptalk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else → static web SPA.
    location / {
        proxy_pass http://sharptalk_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
