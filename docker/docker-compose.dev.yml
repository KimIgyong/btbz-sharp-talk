# Development infrastructure containers (DB, Redis, RabbitMQ) — Amoeba Structure v2.
services:
  mysql:
    image: mysql:8.0
    container_name: sharptalk_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: db_sharptalk
      MYSQL_USER: sharptalk
      MYSQL_PASSWORD: sharptalk_dev_pw
    ports:
      - '3316:3306'
    volumes:
      - sharptalk_mysql_data:/var/lib/mysql
      # Schema is built by TypeORM synchronize in dev (npm run db:seed).
      # The DDL in docker/init-sql/01-schema.sql is the staging/production reference.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharptalk_redis
    ports:
      - '6389:6379'
    volumes:
      - sharptalk_redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sharptalk_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sharptalk
      RABBITMQ_DEFAULT_PASS: sharptalk_dev_pw
    ports:
      - '5682:5672'
      - '15682:15672'
    volumes:
      - sharptalk_rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: sharptalk_qdrant
    ports:
      - '6343:6333'
    volumes:
      - sharptalk_qdrant_data:/qdrant/storage

volumes:
  sharptalk_mysql_data:
  sharptalk_redis_data:
  sharptalk_rabbitmq_data:
  sharptalk_qdrant_data:
